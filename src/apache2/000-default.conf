<VirtualHost *:80>
	ServerName @@HOSTNAME@@.local
	ServerAdmin webmaster@@@HOSTNAME@@.local
	DocumentRoot /var/www/html
	LogLevel error
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# Fallback-AP clients (src/fallback-ap) have no trusted CA and no real
	# DNS, so redirecting them to Cockpit's self-signed HTTPS like normal
	# LAN clients would just produce a cert-warning wall. Instead, proxy
	# them straight into Cockpit over plain HTTP on our side, ignoring the
	# self-signed cert on Cockpit's side. Matches the whole APIPA block
	# (169.254.0.0/16) rather than one address, since AP_IPV4_CIDR is
	# admin-configurable.
	#
	# ProxyPass/ProxyPassReverse can't be used conditionally (mod_proxy's
	# directives aren't valid inside <If>), so the condition is done via
	# mod_rewrite instead: tag matching requests with an env var, then
	# gate both the Origin header and the proxy hand-off on that var.
	SSLProxyEngine On
	SSLProxyVerify none
	SSLProxyCheckPeerCN off
	SSLProxyCheckPeerName off
	SSLProxyCheckPeerExpire off
	ProxyPreserveHost Off
	ProxyPassReverse / https://127.0.0.1:9090/

	RewriteEngine On

	RewriteCond expr "-R '169.254.0.0/16'"
	RewriteRule ^ - [E=FALLBACK_AP:1]

	# Cockpit only trusts a WebSocket's Origin when it matches the
	# Host/protocol it sees the request arrive on (its own dynamic
	# same-origin default — see cockpit_web_service_create_socket() in
	# cockpitwebservice.c). With ProxyPreserveHost Off it sees Host:
	# 127.0.0.1:9090 over real TLS, so pin Origin to match instead of
	# forwarding the client's actual (mismatched) one. Deliberately NOT
	# done via cockpit.conf's Origins= — setting that replaces Cockpit's
	# dynamic default rather than adding to it, which would break every
	# other way of reaching Cockpit.
	RequestHeader set Origin "https://127.0.0.1:9090" env=FALLBACK_AP

	RewriteCond %{ENV:FALLBACK_AP} =1
	RewriteRule ^ https://127.0.0.1:9090%{REQUEST_URI} [P,L]

	RewriteCond %{HTTPS} off
	RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>
