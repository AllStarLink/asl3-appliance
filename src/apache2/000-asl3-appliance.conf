# The appliance's port 80 site. No ServerName: it is the default site for
# every name, so certbot (asl-web-ui's HTTPS page) finds it for the names of
# a Let's Encrypt certificate.
<VirtualHost *:80>
	DocumentRoot /var/www/html
	LogLevel error
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	Alias /asl3/ /usr/share/asl3-appliance/web/

	# Fallback-AP clients (src/fallback-ap) have no trusted CA and no real
	# DNS. Transparently reverse-proxying them into Cockpit was tried and
	# dropped — Cockpit's own session/auth model (Secure-cookie handling
	# tied to the backend connection being real TLS, and further failures
	# opening the shell's own internal machine connection after login)
	# kept surfacing new problems not worth chasing further. Instead, just
	# hand them a static page linking to Cockpit's real HTTPS endpoint,
	# with a note about the expected self-signed-cert warning — the same
	# warning every other ASL install without its own certificate already
	# expects users to accept. Matches the fallback AP's whole fixed /29
	# window (192.168.187.64/29) rather than one address, since
	# AP_IPV4_CIDR is admin-configurable within it.
	RewriteEngine On

	# Serve the page's own files (css/img/js under /asl3/) as they are, not
	# the page in their place and not via the HTTPS redirect below. Every
	# other request gets the page. Deliberately keyed off the path rather
	# than Referer: browsers/extensions can suppress or restrict that
	# header, which would make asset loading intermittently break instead
	# of reliably work.
	RewriteCond expr "-R '192.168.187.64/29'"
	RewriteRule ^/asl3/ - [L]
	RewriteCond expr "-R '192.168.187.64/29'"
	RewriteRule ^ /asl3/fallback-ap.html [PT,L]

	# Let's Encrypt checks each name, also at renewal, over plain HTTP.
	RewriteCond %{HTTPS} off
	RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
	RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>
