# The appliance's HTTPS site, the default site for every name. It uses the
# self-signed certificate until asl-web-ui's HTTPS page gets a Let's Encrypt
# one: then asl-web-ui writes /etc/asl-web-ui/apache-tls.conf with that
# certificate and certbot's recommended TLS settings
# (/etc/letsencrypt/options-ssl-apache.conf), which replace the ones here.
<IfModule ssl_module>
<VirtualHost *:443>
	DocumentRoot /usr/share/asl3-appliance/web
	LogLevel error
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# Content admins put in /var/www/html before the landing page moved
	# (Supermon, their own pages) keeps working: serve it from there when
	# the appliance's own web root has no such file or directory.
	RewriteEngine On
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
	RewriteCond /var/www/html%{REQUEST_URI} -f [OR]
	RewriteCond /var/www/html%{REQUEST_URI} -d
	RewriteRule ^ /var/www/html%{REQUEST_URI} [L]

	SSLEngine on
	SSLProtocol	    all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
	SSLCipherSuite	 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
	SSLHonorCipherOrder     off
	SSLSessionTickets       off
	SSLOptions +StrictRequire
	<IfFile !/etc/asl-web-ui/apache-tls.conf>
		SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
		SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
	</IfFile>
	IncludeOptional /etc/asl-web-ui/apache-tls.conf
</VirtualHost>
</IfModule>
